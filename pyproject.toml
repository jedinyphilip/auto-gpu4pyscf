[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-gpu4pyscf"
version = "0.1.0"
description = "Build and run gpu4pyscf compiled for the GPU you actually have"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Philip Jediny", email = "jedinyp@proton.me" }]
keywords = ["gpu4pyscf", "pyscf", "cuda", "quantum chemistry", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# The menu deliberately has no runtime dependencies: it has to work on a fresh
# host before anything else is installed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "shellcheck-py>=0.10"]

[project.scripts]
auto-gpu4pyscf = "auto_gpu4pyscf.cli:main"

[project.urls]
"Upstream project" = "https://github.com/pyscf/gpu4pyscf"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
# examples/ holds upstream's files, copied unmodified; linting them would mean
# editing them.
extend-exclude = ["env", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "SIM105",  # contextlib.suppress is not clearer in a two-line except
]

[tool.ruff.lint.per-file-ignores]
"share/*.py" = ["UP"]  # runs inside the image on whatever python is there


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
