name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: pytest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck menu.sh scripts/*.sh examples/*.sh

  powershell:
    # The .ps1 wrappers cannot be exercised on the Linux box they were written
    # on, so at least parse them and run the analyser here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $failed = $true
                  Write-Host "::error file=$($file.Name)::$($errors | Out-String)"
              }
          }
          if ($failed) { exit 1 }
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $found = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($found) { $found | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Cannot build here -- no GPU, and the image is 5 GB -- but this catches
      # syntax errors and, because the context is the repo root, a COPY path
      # that no longer resolves.
      - run: docker build --check --build-arg CUDA_ARCH=120-real -f docker/Dockerfile .
